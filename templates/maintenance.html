<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 점검 안내</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-wrap {
            width: 96px;
            height: 96px;
            margin: 0 auto 28px;
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            position: relative;
        }

        .icon-wrap::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 2px dashed rgba(59, 130, 246, 0.4);
            animation: spin 12s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 14px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-sub);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .notice-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            text-align: left;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .notice-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .notice-item:last-child {
            margin-bottom: 0;
        }

        .notice-bullet {
            color: var(--accent);
            font-weight: 700;
        }

        .btn-retry {
            display: inline-block;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        .admin-link {
            display: block;
            margin-top: 20px;
            color: #64748b;
            font-size: 13px;
            text-decoration: underline;
        }
        .admin-link:hover {
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-wrap">⚙️</div>
        <h1>시스템 점검 안내</h1>
        <p>현재 서비스 안정화 및 콘텐츠 데이터 업데이트 작업이 진행 중입니다.<br>잠시 후 다시 접속해 주시기 바랍니다.</p>
        
        <div class="notice-box">
            <div class="notice-item">
                <span class="notice-bullet">•</span>
                <span><strong>점검 사유:</strong> 서버 안정화 및 데이터 백업/업데이트</span>
            </div>
            <div class="notice-item">
                <span class="notice-bullet">•</span>
                <span>이용에 불편을 드려 죄송합니다. 빠르게 작업을 완료하겠습니다.</span>
            </div>
        </div>

        <button class="btn-retry" onclick="location.reload()">🔄 다시 시도하기</button>

        <a href="/admin/login" class="admin-link">관리자 로그인</a>
    </div>
</body>
</html>
